{% extends 'base.html' %}


{% block content %}



<div class="container">

    <div class="box">
<div class="crop-logo">
    🌱
</div>
        <h3> Crop Recommendation</h3>

        <form method="POST">

            {% csrf_token %}

            <input type="number"
name="N"
placeholder="🧪 Nitrogen (0-140)"
required
min="0"
max="140"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid Nitrogen value between 0 and 140')"
oninput="this.setCustomValidity('')">


<input type="number"
name="P"
placeholder=" 🌿Phosphorus (5-145)"
required
min="5"
max="145"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid Phosphorus value between 5 and 145')"
oninput="this.setCustomValidity('')">


<input type="number"
name="K"
placeholder="🌾Potassium (5-205)"
required
min="5"
max="205"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid Potassium value between 5 and 205')"
oninput="this.setCustomValidity('')">


<input type="number"
name="temperature"
placeholder="🌡️Temperature °C (5-45)"
required
min="5"
max="45"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid temperature between 5°C and 45°C')"
oninput="this.setCustomValidity('')">


<input type="number"
name="humidity"
placeholder="💧Humidity % (10-100)"
required
min="10"
max="100"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid humidity between 10% and 100%')"
oninput="this.setCustomValidity('')">


<input type="number"
name="ph"
placeholder="⚗️pH Value (3.5-9.5)"
required
min="3.5"
max="9.5"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid pH value between 3.5 and 9.5')"
oninput="this.setCustomValidity('')">


<input type="number"
name="rainfall"
placeholder="🌧️Rainfall mm (20-300)"
required
min="20"
max="300"
step="0.1"
oninvalid="this.setCustomValidity('Enter valid rainfall between 20mm and 300mm')"
oninput="this.setCustomValidity('')">
            <button type="submit">
                ✨Predict Crop
            </button>
            

        </form>

        {% if prediction %}

<div class="result-box">

    <h3>🌱 Recommended Crop</h3>

    <h1>{{ prediction|title }}</h1>

</div>

{% endif %}
    </div>
    
 </div>
<div style="width:90%;
 max-width:700px; margin:20px auto 0;">

   <a href="/" class="back-btn">
    ←Back to Home🏠 </a>

</div>

    
{% endblock %}
